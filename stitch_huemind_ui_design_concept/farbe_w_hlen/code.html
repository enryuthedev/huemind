<!DOCTYPE html>

<html class="light" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HueMind - Triff den Farbton</title>

                        "on-primary-fixed-variant": "#474746",
                        "surface-container-high": "#ebe7e6",

                    "borderRadius": {

<style>
        body {
            background-color: #F8F7F4;
        }
        
        .color-picker-area {
            background: linear-gradient(to bottom, transparent, black), linear-gradient(to right, white, #ff0000);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        
        .hue-slider-track {
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
        }
        
        .brightness-slider-track {
            background: linear-gradient(to right, #000000, #ffffff);
        }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #171717;
            cursor: pointer;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.15);
            margin-top: -10px;
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            border-radius: 2px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-surface antialiased flex flex-col items-center justify-center py-stack-gap-lg px-container-padding">
<!-- Top Navigation (Shell logic: Supressed since this is a focused task, but we include a back button implying context) -->
<header class="w-full top-0 bg-transparent flex items-center justify-between px-container-padding h-16 max-w-desktop mx-auto absolute">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-display text-headline-md text-primary tracking-tight">HueMind</div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md mx-auto flex flex-col gap-stack-gap-lg pt-16">
<!-- Header Text -->
<div class="text-center space-y-unit">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary">Triff den Farbton</h1>
<p class="font-body-md text-on-surface-variant">Ziehe den Regler, bis es sich richtig anfühlt.</p>
</div>
<!-- Color Selection Area -->
<div class="bg-surface-container-lowest rounded-huemind-card p-stack-gap-md shadow-ambient border border-huemind-grey flex flex-col gap-stack-gap-md">
<!-- Large Color Square -->
<div class="relative w-full aspect-square rounded-xl overflow-hidden cursor-crosshair color-picker-area group">
<!-- Selection Reticle -->
<div class="absolute top-[40%] left-[60%] w-6 h-6 -ml-3 -mt-3 rounded-full border-2 border-white shadow-[0_0_0_1px_rgba(0,0,0,0.2)] bg-transparent transition-transform group-active:scale-90 pointer-events-none"></div>
</div>
<!-- Controls -->
<div class="space-y-stack-gap-sm">
<!-- Hue Slider -->
<div class="space-y-2">
<div class="h-4 w-full rounded-full hue-slider-track relative">
<input aria-label="Farbton" class="absolute w-full h-full opacity-0 cursor-pointer z-10" max="100" min="0" type="range" value="0"/>
<!-- Custom Thumb Indicator (Visual only, actual input is transparent above) -->
<div class="absolute top-1/2 left-[0%] -translate-y-1/2 -ml-3 w-6 h-6 rounded-full bg-white border-2 border-huemind-charcoal shadow-sm pointer-events-none"></div>
</div>
</div>
<!-- Brightness Slider -->
<div class="space-y-2 pt-2">
<div class="h-4 w-full rounded-full brightness-slider-track relative">
<input aria-label="Helligkeit" class="absolute w-full h-full opacity-0 cursor-pointer z-10" max="100" min="0" type="range" value="80"/>
<!-- Custom Thumb Indicator -->
<div class="absolute top-1/2 left-[80%] -translate-y-1/2 -ml-3 w-6 h-6 rounded-full bg-white border-2 border-huemind-charcoal shadow-sm pointer-events-none"></div>
</div>
</div>
</div>
</div>
<!-- Live Preview -->
<div class="flex flex-col items-center gap-stack-gap-sm">
<span class="font-label-caps text-on-surface-variant uppercase tracking-wider">Deine Auswahl</span>
<div class="w-24 h-24 rounded-full bg-[#cc3333] shadow-ambient border-4 border-surface-container-lowest relative">
<!-- Inner glow for vibrance -->
<div class="absolute inset-0 rounded-full shadow-[inset_0_0_12px_rgba(255,255,255,0.3)]"></div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-huemind-charcoal text-on-primary py-4 px-8 rounded-[20px] font-body-lg font-medium hover:opacity-90 active:scale-95 transition-all duration-200 shadow-ambient">
            Farbe bestätigen
        </button>
</main>
</body></html>
