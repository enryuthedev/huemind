<style>
        .target-color-shadow {
            box-shadow: 0 0 60px rgba(255, 127, 80, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-surface-variant selection:text-on-surface">
<!-- Top Left: Pause Button -->
<button aria-label="Pause Game" class="absolute top-6 left-6 p-3 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors duration-200 flex items-center justify-center shadow-[0px_4px_20px_rgba(0,0,0,0.04)] z-10">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">pause</span>
</button>
<!-- Main Content Area -->
<main class="w-full max-w-desktop px-container-padding flex flex-col items-center justify-center flex-1 z-0">
<!-- Minimal Countdown Ring -->
<div class="relative w-16 h-16 mb-stack-gap-lg flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 64 64">
<!-- Background Track -->
<circle class="text-surface-variant opacity-50" cx="32" cy="32" fill="none" r="28" stroke="currentColor" stroke-width="6"></circle>
<!-- Progress Track (Animating) -->
<circle class="text-primary transition-all duration-1000 ease-linear" cx="32" cy="32" fill="none" r="28" stroke="currentColor" stroke-dasharray="175.93" stroke-dashoffset="0" stroke-width="6"></circle>
</svg>
<span aria-live="polite" class="absolute font-headline-md text-headline-md text-primary">5</span>
</div>
<!-- Dominant Color Area -->
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full mb-stack-gap-md transition-transform duration-300 ease-out flex-shrink-0 pulse-animation" style="background-color: #FF7F50;">
<!-- Subtle inner gradient/glow for depth -->
<div class="absolute inset-0 rounded-full target-color-shadow"></div>
</div>
<!-- Instruction Text -->
<div class="mt-stack-gap-md text-center max-w-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight">
                Präge dir diese Farbe ein.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">
                Fokussiere dich auf den exakten Ton.
            </p>
</div>
</main>
<script>
        // Simple script to animate the countdown ring visually (demonstration purpose)
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('circle.text-primary');
            const circumference = 2 * Math.PI * 28; // r=28
            const totalTime = 5; // seconds
            let timeLeft = totalTime;
            const numberSpan = document.querySelector('.relative.w-16.h-16 span');

            const interval = setInterval(() => {
                timeLeft -= 1;
                numberSpan.textContent = timeLeft;
                
                const offset = circumference - (timeLeft / totalTime) * circumference;
                circle.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    // Transition to next state...
                }
            }, 1000);
        });
    </script>
</body></html>
