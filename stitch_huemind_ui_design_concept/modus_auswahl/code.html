<!DOCTYPE html>

<html class="light" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HueMind - Wähle deinen Modus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f4f0ef",
                        "on-surface-variant": "#444748",
                        "surface-container": "#f1edec",
                        "on-error-container": "#93000a",
                        "on-surface": "#1c1b1b",
                        "on-secondary-fixed-variant": "#464747",
                        "on-primary-container": "#858383",
                        "secondary-container": "#e1dfdf",
                        "tertiary-container": "#1c1b1a",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#1c1b1a",
                        "background": "#fdf8f8",
                        "outline-variant": "#c4c7c7",
                        "on-primary-fixed-variant": "#474746",
                        "surface-container-high": "#ebe7e6",
                        "tertiary-fixed-dim": "#cac6c4",
                        "on-tertiary-container": "#868382",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-container-highest": "#e5e2e1",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed-variant": "#484645",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "primary-container": "#1c1b1b",
                        "surface-dim": "#ddd9d8",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fdf8f8",
                        "surface-container-low": "#f7f3f2",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#626262",
                        "tertiary": "#000000",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "secondary": "#5e5e5e",
                        "outline": "#747878",
                        "on-secondary-fixed": "#1b1c1c",
                        "tertiary-fixed": "#e6e2df",
                        "surface-tint": "#5f5e5e",
                        "surface-bright": "#fdf8f8",
                        "inverse-surface": "#313030",
                        "primary-fixed-dim": "#c8c6c5",
                        "secondary-fixed": "#e4e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "card": "28px",
                        "button": "20px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-gap-lg": "48px",
                        "max-width-desktop": "1200px",
                        "stack-gap-md": "24px",
                        "stack-gap-sm": "12px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "display": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                        "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    },
                    "boxShadow": {
                        "ambient-soft": "0px 4px 20px rgba(0, 0, 0, 0.04)",
                        "ambient-selected": "0px 8px 30px rgba(0, 0, 0, 0.08)"
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #F8F7F4; }
        .mode-card {
            transition: all 0.3s ease;
        }
        .mode-card:hover {
            transform: scale(0.98);
        }
        .mode-card.selected {
            border-color: #171717;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.08);
            transform: scale(1.02);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ECEBE7;
        }
        .dot.active {
            background-color: #171717;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-background pb-32">
<!-- Top Navigation Placeholder (Hidden for this specific task flow, but keeping space if needed) -->
<header class="flex items-center justify-between px-container-padding h-16 w-full max-w-desktop mx-auto mt-4">
<button aria-label="Go Back" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="font-display text-headline-md text-primary tracking-tight">HueMind</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="max-w-desktop mx-auto px-container-padding pt-stack-gap-md pb-stack-gap-lg">
<div class="text-center mb-stack-gap-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Wähle deinen Modus</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Wie möchtest du heute trainieren?</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-md max-w-3xl mx-auto">
<!-- Easy Mode -->
<button class="mode-card bg-surface-container-lowest border border-outline-variant rounded-card p-6 flex flex-col items-start text-left shadow-ambient-soft w-full cursor-pointer focus:outline-none" onclick="selectCard(this)">
<div class="flex justify-between w-full mb-4">
<span class="material-symbols-outlined text-on-surface text-3xl">spa</span>
<div class="flex gap-1">
<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Easy Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">10 Sekunden merken</p>
<span class="font-label-caps text-label-caps text-primary bg-surface-container py-1 px-3 rounded-full mt-auto">Für entspanntes Training</span>
</button>
<!-- Normal Mode -->
<button class="mode-card selected bg-surface-container-lowest border border-primary rounded-card p-6 flex flex-col items-start text-left shadow-ambient-selected w-full cursor-pointer focus:outline-none" onclick="selectCard(this)">
<div class="flex justify-between w-full mb-4">
<span class="material-symbols-outlined text-on-surface text-3xl">dashboard</span>
<div class="flex gap-1">
<span class="dot active"></span>
<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Normal Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">5 Sekunden merken</p>
<span class="font-label-caps text-label-caps text-primary bg-surface-container py-1 px-3 rounded-full mt-auto">Der klassische Modus</span>
</button>
<!-- Hard Mode -->
<button class="mode-card bg-surface-container-lowest border border-outline-variant rounded-card p-6 flex flex-col items-start text-left shadow-ambient-soft w-full cursor-pointer focus:outline-none" onclick="selectCard(this)">
<div class="flex justify-between w-full mb-4">
<span class="material-symbols-outlined text-on-surface text-3xl">bolt</span>
<div class="flex gap-1">
<span class="dot active"></span>
<span class="dot active"></span>
<span class="dot active"></span>
<span class="dot"></span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Hard Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">3 Sekunden merken</p>
<span class="font-label-caps text-label-caps text-primary bg-surface-container py-1 px-3 rounded-full mt-auto">Für schnelle Augen</span>
</button>
<!-- Hardcore Mode -->
<button class="mode-card bg-surface-container-lowest border border-outline-variant rounded-card p-6 flex flex-col items-start text-left shadow-ambient-soft w-full cursor-pointer focus:outline-none" onclick="selectCard(this)">
<div class="flex justify-between w-full mb-4">
<span class="material-symbols-outlined text-on-surface text-3xl">warning</span>
<div class="flex gap-1">
<span class="dot active"></span>
<span class="dot active"></span>
<span class="dot active"></span>
<span class="dot active"></span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Hardcore Mode</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Ablenkfarben + 3 Sekunden</p>
<span class="font-label-caps text-label-caps text-on-error-container bg-error-container py-1 px-3 rounded-full mt-auto">Das Gehirn wird ausgetrickst</span>
</button>
</div>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-[#F8F7F4] via-[#F8F7F4] to-transparent z-50">
<div class="max-w-3xl mx-auto flex justify-center">
<button class="w-full md:w-auto bg-[#171717] text-on-primary font-body-lg text-body-lg py-4 px-12 rounded-button shadow-lg hover:shadow-xl hover:scale-[0.98] transition-all duration-200">
                Modus starten
            </button>
</div>
</div>
<script>
        function selectCard(clickedCard) {
            // Remove 'selected' class and reset border/shadow for all cards
            const cards = document.querySelectorAll('.mode-card');
            cards.forEach(card => {
                card.classList.remove('selected');
                card.classList.remove('border-primary', 'shadow-ambient-selected');
                card.classList.add('border-outline-variant', 'shadow-ambient-soft');
            });

            // Add 'selected' class and update styles for clicked card
            clickedCard.classList.add('selected');
            clickedCard.classList.remove('border-outline-variant', 'shadow-ambient-soft');
            clickedCard.classList.add('border-primary', 'shadow-ambient-selected');
        }
    </script>
</body></html>
