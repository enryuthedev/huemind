<style>
        body {
            background-color: #F8F7F4;
        }
        
        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(135, 206, 235, 0.15) 0%, rgba(248, 247, 244, 0) 70%);
            z-index: -1;
            pointer-events: none;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }
        
        @keyframes pulse-glow {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        .ambient-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }

        .game-color-target { background-color: #64A38F; } /* Example target color */
        .game-color-selected { background-color: #5D9B87; } /* Example selected color slightly off */

      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-surface min-h-screen flex flex-col relative overflow-x-hidden">
<div class="glow-effect"></div>
<!-- Top Navigation (Shell suppressed per rules for transactional/result screens, but requested TopAppBar present) -->
<header class="flex items-center justify-between px-container-padding h-16 w-full max-w-desktop mx-auto bg-background flat no shadows">
<button class="flex items-center justify-center p-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 duration-200 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display text-headline-md text-primary tracking-tight">HueMind</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 w-full max-w-desktop mx-auto px-container-padding py-stack-gap-md flex flex-col items-center justify-center z-10">
<!-- Color Comparison Bento -->
<div class="w-full max-w-2xl grid grid-cols-2 gap-stack-gap-sm md:gap-stack-gap-md mb-stack-gap-lg">
<!-- Original -->
<div class="flex flex-col items-center">
<div class="w-full aspect-square rounded-3xl ambient-shadow game-color-target border border-outline-variant/20 relative overflow-hidden group">
<!-- Inner glow simulation -->
<div class="absolute inset-0 shadow-[inset_0_0_40px_rgba(255,255,255,0.2)] pointer-events-none"></div>
</div>
<span class="mt-4 font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Original</span>
</div>
<!-- Selection -->
<div class="flex flex-col items-center">
<div class="w-full aspect-square rounded-3xl ambient-shadow game-color-selected border border-outline-variant/20 relative overflow-hidden">
<div class="absolute inset-0 shadow-[inset_0_0_40px_rgba(255,255,255,0.2)] pointer-events-none"></div>
</div>
<span class="mt-4 font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Deine Auswahl</span>
</div>
</div>
<!-- Score & Feedback -->
<div class="text-center mb-stack-gap-lg flex flex-col items-center">
<h2 class="font-display text-[64px] md:text-[80px] leading-none font-extrabold text-primary tracking-tighter mb-2">87 <span class="text-on-surface-variant text-headline-lg font-medium">/ 100</span></h2>
<p class="font-headline-md text-headline-md text-primary mb-6">Sehr nah dran.</p>
<!-- Details Pills -->
<div class="flex flex-wrap justify-center gap-3">
<div class="px-4 py-2 bg-surface-container-high rounded-full ambient-shadow">
<span class="font-label-caps text-label-caps text-on-surface">Farbabweichung: <span class="text-secondary">13%</span></span>
</div>
<div class="px-4 py-2 bg-surface-container-high rounded-full ambient-shadow">
<span class="font-label-caps text-label-caps text-on-surface">Reaktionszeit: <span class="text-secondary">2.4s</span></span>
</div>
<div class="px-4 py-2 bg-surface-container-high rounded-full ambient-shadow border border-outline-variant/30">
<span class="font-label-caps text-label-caps text-primary">Modus-Bonus: <span class="font-bold">+5</span></span>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full max-w-sm flex flex-col gap-4 mt-auto md:mt-0">
<button class="w-full py-4 px-8 bg-[#171717] text-on-primary rounded-[20px] font-body-lg text-body-lg flex items-center justify-center ambient-shadow hover:scale-[0.98] transition-transform duration-200">
                Nächste Runde
            </button>
<button class="w-full py-4 px-8 bg-[#ECEBE7] text-[#171717] rounded-[20px] font-body-lg text-body-lg flex items-center justify-center hover:bg-surface-container-high transition-colors">
                Nochmal versuchen
            </button>
<a class="w-full py-3 text-center font-body-md text-body-md text-secondary hover:text-primary transition-colors mt-2" href="#">
                Home
            </a>
</div>
</main>
<script>
        // Subtle entrance animation
        document.addEventListener("DOMContentLoaded", () => {
            const elements = document.querySelectorAll('main > div');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 + (index * 150));
            });
        });
    </script>
</body></html>
