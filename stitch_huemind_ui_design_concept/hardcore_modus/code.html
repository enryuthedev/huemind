<style>
        body {
            background-color: #F8F7F4;
        }
        
        .color-card {
            transition: all 0.1s ease-in-out;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        @keyframes pulse-intense {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        
        .intense-pulse {
            animation: pulse-intense 0.5s infinite;
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }
        
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 rgba(255, 0, 0, 0.5);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
            clip: rect(24px, 550px, 90px, 0);
        }
        
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 rgba(0, 0, 255, 0.5);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            clip: rect(85px, 550px, 140px, 0);
        }
        
        @keyframes glitch-anim-1 {
            0% { clip: rect(15px, 9999px, 83px, 0); }
            20% { clip: rect(4px, 9999px, 55px, 0); }
            40% { clip: rect(72px, 9999px, 16px, 0); }
            60% { clip: rect(29px, 9999px, 66px, 0); }
            80% { clip: rect(88px, 9999px, 9px, 0); }
            100% { clip: rect(42px, 9999px, 78px, 0); }
        }
        
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(24px, 9999px, 15px, 0); }
            40% { clip: rect(42px, 9999px, 86px, 0); }
            60% { clip: rect(9px, 9999px, 56px, 0); }
            80% { clip: rect(78px, 9999px, 29px, 0); }
            100% { clip: rect(52px, 9999px, 48px, 0); }
        }

    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Top Navigation (Suppressed - Flow Screen) -->
<header class="absolute top-0 w-full flex items-center justify-between px-container-padding h-16 max-w-desktop mx-auto z-10">
<!-- Leading Icon -->
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<!-- No Title, minimal distraction -->
<div class="w-6"></div>
</header>
<main class="w-full max-w-md px-container-padding flex flex-col items-center justify-center flex-grow z-10">
<!-- Headers -->
<div class="text-center mb-stack-gap-lg w-full">
<h1 class="font-display text-display text-primary tracking-tight mb-stack-gap-sm glitch-text" data-text="Ablenkphase">Ablenkphase</h1>
<p class="font-body-lg text-body-lg text-secondary">Nicht merken – nur beobachten.</p>
</div>
<!-- Fast Changing Grid Container -->
<div class="relative w-full aspect-square max-w-[320px] mb-stack-gap-lg">
<!-- Stacked Cards Effect behind the main grid to create depth -->
<div class="absolute inset-0 rounded-[28px] bg-secondary-container transform scale-95 translate-y-4 opacity-50"></div>
<div class="absolute inset-0 rounded-[28px] bg-surface-container-highest transform scale-90 translate-y-8 opacity-30"></div>
<!-- Main Interactive Grid Area -->
<div class="relative w-full h-full rounded-[28px] bg-surface-container overflow-hidden grid grid-cols-3 grid-rows-3 gap-2 p-2 shadow-lg z-10 border border-outline-variant/30" id="color-grid">
<!-- Grid items generated by JS -->
</div>
<!-- Progress Ring Overlay (Subtle) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none transform -rotate-90 z-20" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="rgba(28, 27, 27, 0.05)" stroke-width="2"></circle>
<circle class="transition-all duration-100 ease-linear" cx="50" cy="50" fill="none" id="timer-progress" r="48" stroke="#1c1b1b" stroke-dasharray="301.59" stroke-dashoffset="0" stroke-width="4"></circle>
</svg>
</div>
</main>
<!-- Bottom Navigation (Suppressed - Flow Screen) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('color-grid');
            const progressCircle = document.getElementById('timer-progress');
            const totalDuration = 5000; // 5 seconds for this phase
            let startTime = null;

            // Soft minimalist palette for intense phase (slightly bolder than usual but still soft)
            const colors = [
                '#FF6B6B', '#4ECDC4', '#FFE66D', '#292F36', 
                '#F7FFF7', '#FF8C42', '#3185FC', '#E84855',
                '#9D4EDD', '#F4A261', '#2A9D8F', '#E76F51'
            ];

            // Create initial grid
            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                tile.className = 'rounded-xl color-card h-full w-full opacity-80';
                tile.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                gridContainer.appendChild(tile);
            }

            const tiles = gridContainer.children;

            // Fast flashing logic
            function flashColors() {
                // Change 3-5 random tiles very quickly
                const numChanges = Math.floor(Math.random() * 3) + 3;
                for(let i=0; i<numChanges; i++) {
                    const randomTileIndex = Math.floor(Math.random() * tiles.length);
                    const randomColorIndex = Math.floor(Math.random() * colors.length);
                    
                    tiles[randomTileIndex].style.backgroundColor = colors[randomColorIndex];
                    
                    // Subtle scale bump for intensity
                    tiles[randomTileIndex].style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        if(tiles[randomTileIndex]) {
                            tiles[randomTileIndex].style.transform = 'scale(1)';
                        }
                    }, 50);
                }
            }

            // Interval for fast changes (very fast for hardcore mode)
            const flashInterval = setInterval(flashColors, 150);

            // Timer logic for progress ring
            function updateProgress(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / totalDuration, 1);
                
                // circumference is 2 * pi * 48 ~= 301.59
                const dashoffset = 301.59 * (1 - progress);
                progressCircle.style.strokeDashoffset = dashoffset;

                // Add intense pulse effect near the end
                if (progress > 0.8) {
                    gridContainer.classList.add('intense-pulse');
                }

                if (progress < 1) {
                    requestAnimationFrame(updateProgress);
                } else {
                    clearInterval(flashInterval);
                    gridContainer.classList.remove('intense-pulse');
                    // Transition to next state here
                }
            }

            requestAnimationFrame(updateProgress);
        });
    </script>
</body></html>
