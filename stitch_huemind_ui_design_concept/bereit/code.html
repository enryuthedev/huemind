<!DOCTYPE html>

<html class="dark" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HueMind - Ready Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f4f0ef",
                        "on-surface-variant": "#444748",
                        "surface-container": "#f1edec",
                        "on-error-container": "#93000a",
                        "on-surface": "#1c1b1b",
                        "on-secondary-fixed-variant": "#464747",
                        "on-primary-container": "#858383",
                        "secondary-container": "#e1dfdf",
                        "tertiary-container": "#1c1b1a",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#1c1b1a",
                        "background": "#fdf8f8",
                        "outline-variant": "#c4c7c7",
                        "on-primary-fixed-variant": "#474746",
                        "surface-container-high": "#ebe7e6",
                        "tertiary-fixed-dim": "#cac6c4",
                        "on-tertiary-container": "#868382",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-container-highest": "#e5e2e1",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed-variant": "#484645",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "primary-container": "#1c1b1b",
                        "surface-dim": "#ddd9d8",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fdf8f8",
                        "surface-container-low": "#f7f3f2",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#626262",
                        "tertiary": "#000000",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "secondary": "#5e5e5e",
                        "outline": "#747878",
                        "on-secondary-fixed": "#1b1c1c",
                        "tertiary-fixed": "#e6e2df",
                        "surface-tint": "#5f5e5e",
                        "surface-bright": "#fdf8f8",
                        "inverse-surface": "#313030",
                        "primary-fixed-dim": "#c8c6c5",
                        "secondary-fixed": "#e4e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-gap-lg": "48px",
                        "max-width-desktop": "1200px",
                        "stack-gap-md": "24px",
                        "stack-gap-sm": "12px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "display": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #F8F7F4; /* Requested base color */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden">
<!-- Main Content Canvas -->
<main class="w-full max-w-desktop px-container-padding flex flex-col items-center justify-center text-center relative z-10">
<!-- Game Readiness Indicator / Icon -->
<div class="mb-stack-gap-md flex items-center justify-center w-24 h-24 bg-surface-container-high rounded-[28px] shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="palette">palette</span>
</div>
<!-- Headline -->
<h1 class="font-display text-display text-primary tracking-tight mb-stack-gap-sm max-w-md mx-auto">
            Bereit?
        </h1>
<!-- Subheadline / Instruction -->
<p class="font-body-lg text-body-lg text-secondary mb-stack-gap-lg max-w-md mx-auto">
            Merke dir die nächste Farbe so genau wie möglich.
        </p>
<!-- Game Details Card -->
<div class="bg-surface-container-lowest rounded-[28px] p-stack-gap-md border border-surface-variant shadow-[0px_4px_20px_rgba(0,0,0,0.04)] mb-stack-gap-lg w-full max-w-sm">
<div class="flex flex-col gap-stack-gap-sm">
<div class="flex justify-between items-center py-2 border-b border-surface-variant last:border-0">
<span class="font-label-caps text-label-caps text-secondary uppercase">Modus</span>
<span class="font-headline-md text-headline-md text-primary">Normal</span>
</div>
<div class="flex justify-between items-center py-2 border-b border-surface-variant last:border-0">
<span class="font-label-caps text-label-caps text-secondary uppercase">Zeit</span>
<span class="font-headline-md text-headline-md text-primary">5 Sekunden</span>
</div>
</div>
</div>
<!-- Call to Action -->
<button class="bg-primary text-on-primary font-headline-md text-headline-md py-4 px-8 rounded-[20px] shadow-[0px_4px_20px_rgba(0,0,0,0.04)] hover:shadow-sm hover:scale-[0.98] transition-all duration-200 ease-out flex items-center gap-2">
            Runde starten
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</main>
<!-- Subtle Background Ambient Detail -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-surface-container rounded-full blur-[100px] opacity-30 -z-10 pointer-events-none"></div>
</body></html>
