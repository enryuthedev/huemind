<!DOCTYPE html>

<html class="light" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - HueMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f4f0ef",
                        "on-surface-variant": "#444748",
                        "surface-container": "#f1edec",
                        "on-error-container": "#93000a",
                        "on-surface": "#1c1b1b",
                        "on-secondary-fixed-variant": "#464747",
                        "on-primary-container": "#858383",
                        "secondary-container": "#e1dfdf",
                        "tertiary-container": "#1c1b1a",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#1c1b1a",
                        "background": "#fdf8f8",
                        "outline-variant": "#c4c7c7",
                        "on-primary-fixed-variant": "#474746",
                        "surface-container-high": "#ebe7e6",
                        "tertiary-fixed-dim": "#cac6c4",
                        "on-tertiary-container": "#868382",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-container-highest": "#e5e2e1",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed-variant": "#484645",
                        "on-primary-fixed": "#1c1b1b",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "primary-container": "#1c1b1b",
                        "surface-dim": "#ddd9d8",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fdf8f8",
                        "surface-container-low": "#f7f3f2",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#626262",
                        "tertiary": "#000000",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "secondary": "#5e5e5e",
                        "outline": "#747878",
                        "on-secondary-fixed": "#1b1c1c",
                        "tertiary-fixed": "#e6e2df",
                        "surface-tint": "#5f5e5e",
                        "surface-bright": "#fdf8f8",
                        "inverse-surface": "#313030",
                        "primary-fixed-dim": "#c8c6c5",
                        "secondary-fixed": "#e4e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-gap-lg": "48px",
                        "max-width-desktop": "1200px",
                        "stack-gap-md": "24px",
                        "stack-gap-sm": "12px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "display": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8F7F4; /* Requested Base Background */
        }
        
        /* Toggle Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #171717;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #171717;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #ECEBE7;
            transition: all 0.3s;
        }
        .toggle-label {
            background-color: #ECEBE7;
            border-radius: 9999px;
            transition: all 0.3s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen pb-32 pt-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-[#F8F7F4] dark:bg-inverse-surface">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-desktop mx-auto">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display text-headline-md text-primary dark:text-primary-fixed tracking-tight">HueMind</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-desktop mx-auto px-container-padding flex flex-col gap-stack-gap-lg">
<div class="flex flex-col gap-stack-gap-md pt-stack-gap-md">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-primary">Einstellungen</h2>
</div>
<section class="flex flex-col gap-stack-gap-md">
<!-- Soundeffekte Toggle -->
<div class="flex items-center justify-between p-stack-gap-sm bg-surface-container-lowest rounded-[20px] shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<div class="flex items-center gap-4">
<div class="p-3 bg-surface-variant rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">volume_up</span>
</div>
<div>
<p class="font-body-lg text-on-surface">Soundeffekte</p>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
</div></div></section></main></body></html>
